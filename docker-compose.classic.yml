services:
  database:
    image: mariadb:latest
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASS:-mangos}"
      MYSQL_USER: "${DB_USER:-mangos}"
      MYSQL_PASSWORD: "${DB_PASS:-mangos}"
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - database_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  realmd:
    image: ghcr.io/jrtashjian/cmangos-realmd-classic:latest
    depends_on:
      database:
        condition: service_healthy
    environment:
      DB_HOST: "${DB_HOST:-database}"
      DB_PORT: "${DB_PORT:-3306}"
      DB_USER: "${DB_USER:-mangos}"
      DB_PASS: "${DB_PASS:-mangos}"
      DB_ROOT_PASS: "${DB_ROOT_PASS:-mangos}"
    ports:
      - 3724:3724
    volumes:
      - realmd_etc:/opt/cmangos/etc
      - "/etc/localtime:/etc/localtime:ro"
    healthcheck:
      test: [ "CMD", "check-port", "3724" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s

  mangosd:
    image: ghcr.io/jrtashjian/cmangos-mangosd-classic:latest
    depends_on:
      database:
        condition: service_healthy
      realmd:
        condition: service_healthy
    environment:
      DB_HOST: "${DB_HOST:-database}"
      DB_PORT: "${DB_PORT:-3306}"
      DB_USER: "${DB_USER:-mangos}"
      DB_PASS: "${DB_PASS:-mangos}"
      DB_ROOT_PASS: "${DB_ROOT_PASS:-mangos}"
      INSTALL_FULL_DB: "TRUE"
    ports:
      - 8085:8085
    volumes:
      - mangosd_etc:/opt/cmangos/etc
      - "/etc/localtime:/etc/localtime:ro"
      - "./extracted-data:/opt/cmangos-data:ro"
    healthcheck:
      test: [ "CMD", "check-port", "8085" ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 600s

volumes:
  database_data:
    name: classic_database
  realmd_etc:
    name: classic_realmd_etc
  mangosd_etc:
    name: classic_mangosd_etc
