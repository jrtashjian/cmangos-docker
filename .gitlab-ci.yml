stages:
  - validate
  - build

default:
  image: docker:cli
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY --username $CI_REGISTRY_USER --password-stdin
    - export DATE_TAG="$(date +%Y.%m.%d)"
  after_script:
    - if [ "$CI_COMMIT_BRANCH" != "$CI_DEFAULT_BRANCH" ]; then exit 0; fi
    - docker rmi $IMAGE_NAME:latest $IMAGE_NAME:$DATE_TAG || true

variables:
  IMAGE_NAME: "$CI_REGISTRY_IMAGE/$IMAGE-$VARIANT"
  BUILD_ARGS: >-
    --build-arg CMANGOS_CORE=$VARIANT
    --build-arg BUILDER_BASE=$CI_REGISTRY_IMAGE/builder-base:latest
    --build-arg RUNTIME_BASE=$CI_REGISTRY_IMAGE/runtime-base:latest
    --label org.opencontainers.image.source=$CI_PROJECT_URL

validate-dockerfiles:
  stage: validate
  parallel:
    matrix:
      - IMAGE: [builder-base, runtime-base, extractors, realmd, mangosd]
  script:
    - docker build ./$IMAGE --check

builder-base:
  stage: build
  variables:
    IMAGE: builder-base
    IMAGE_NAME: "$CI_REGISTRY_IMAGE/$IMAGE"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - >-
      docker build ./$IMAGE --no-cache $BUILD_ARGS
      -t $IMAGE_NAME:latest
      -t $IMAGE_NAME:$DATE_TAG
    - docker push $IMAGE_NAME:latest
    - docker push $IMAGE_NAME:$DATE_TAG
  tags:
    - large

runtime-base:
  stage: build
  variables:
    IMAGE: runtime-base
    IMAGE_NAME: "$CI_REGISTRY_IMAGE/$IMAGE"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - >-
      docker build ./$IMAGE --no-cache $BUILD_ARGS
      -t $IMAGE_NAME:latest
      -t $IMAGE_NAME:$DATE_TAG
    - docker push $IMAGE_NAME:latest
    - docker push $IMAGE_NAME:$DATE_TAG
  tags:
    - large

extractors:
  stage: build
  needs: [builder-base]
  parallel:
    matrix:
      - VARIANT: [classic, tbc, wotlk]
  variables:
    IMAGE: extractors
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - >-
      docker build ./$IMAGE --no-cache $BUILD_ARGS
      -t $IMAGE_NAME:latest
      -t $IMAGE_NAME:$DATE_TAG
    - docker push $IMAGE_NAME:latest
    - docker push $IMAGE_NAME:$DATE_TAG
  tags:
    - large

realmd:
  stage: build
  needs: [builder-base, runtime-base]
  parallel:
    matrix:
      - VARIANT: [classic, tbc, wotlk]
  variables:
    IMAGE: realmd
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - >-
      docker build ./$IMAGE --no-cache $BUILD_ARGS
      -t $IMAGE_NAME:latest
      -t $IMAGE_NAME:$DATE_TAG
    - docker push $IMAGE_NAME:latest
    - docker push $IMAGE_NAME:$DATE_TAG
  tags:
    - large

mangosd:
  stage: build
  needs: [builder-base, runtime-base]
  parallel:
    matrix:
      - VARIANT: [classic, tbc, wotlk]
        TYPE: [default, ahbot, playerbot, ahbot-playerbot]
  variables:
    IMAGE: mangosd
  resource_group: mangosd-$VARIANT
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - |
      case "$TYPE" in
        default)
          TAGS="latest $DATE_TAG"
          ;;
        playerbot)
          BUILD_ARGS="$BUILD_ARGS --build-arg BUILD_PLAYERBOTS=ON"
          TAGS="with-playerbot ${DATE_TAG}-with-playerbot"
          ;;
        ahbot)
          BUILD_ARGS="$BUILD_ARGS --build-arg BUILD_AHBOT=ON"
          TAGS="with-ahbot ${DATE_TAG}-with-ahbot"
          ;;
        ahbot-playerbot)
          BUILD_ARGS="$BUILD_ARGS --build-arg BUILD_PLAYERBOTS=ON --build-arg BUILD_AHBOT=ON"
          TAGS="with-playerbot-ahbot ${DATE_TAG}-with-playerbot-ahbot"
          ;;
        *)
          echo "unknown mangosd type: $TYPE" >&2
          exit 1
          ;;
      esac
      TAG_ARGS=""
      for tag in $TAGS; do
        TAG_ARGS="$TAG_ARGS -t $IMAGE_NAME:$tag"
      done
    - docker build ./$IMAGE --no-cache $BUILD_ARGS $TAG_ARGS
    - |
      for tag in $TAGS; do
        docker push "$IMAGE_NAME:$tag"
      done
  tags:
    - large
