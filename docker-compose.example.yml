services:
  database:
    image: mariadb:latest
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASS:-mangos}"
      MYSQL_USER: "${DB_USER:-mangos}"
      MYSQL_PASSWORD: "${DB_PASS:-mangos}"
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - "./data/database:/var/lib/mysql"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  realmd:
    image: ghcr.io/jrtashjian/cmangos-realmd-${CORE_VARIANT}:master
    depends_on:
      database:
        condition: service_healthy
    env_file: .env
    ports:
      - 3724:3724
    volumes:
      - "./data/realmd_etc:/opt/cmangos/etc"
      - "/etc/localtime:/etc/localtime:ro"
    healthcheck:
      test: ["CMD", "check-port", "3724"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s

  mangosd:
    image: ghcr.io/jrtashjian/cmangos-mangosd-${CORE_VARIANT}:master
    depends_on:
      database:
        condition: service_healthy
      realmd:
        condition: service_healthy
    env_file: .env
    ports:
      - 8085:8085
    volumes:
      - "./data/mangosd_etc:/opt/cmangos/etc"
      - "/etc/localtime:/etc/localtime:ro"
      - "./extracted-data:/opt/cmangos-data:ro"
    healthcheck:
      test: ["CMD", "check-port", "8085"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 600s
